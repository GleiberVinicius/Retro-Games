name: Publicar RetroGames no GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'retrogames.web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: retrogames.web/package-lock.json
      - name: Instalar dependências
        run: npm ci --prefix retrogames.web
      - name: Compilar interface
        run: npm run build --prefix retrogames.web
      - name: Preparar rotas do React Router
        run: cp retrogames.web/dist/index.html retrogames.web/dist/404.html
      - name: Preparar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: retrogames.web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
